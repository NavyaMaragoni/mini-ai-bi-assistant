<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini AI BI Assistant</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2433; --muted: #667085;
    --border: #e2e5ea; --accent: #3b5bdb; --accent-soft: #e8edff;
    --error: #b42318; --error-soft: #fef0ee; --bar: #7c96f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b1f29; --text: #e7e9ee; --muted: #98a2b3;
      --border: #2c3240; --accent: #8da2ff; --accent-soft: #252c47;
      --error: #ff8a7a; --error-soft: #3a1f1c; --bar: #5b74e0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 12px 14px; font-size: 1rem; color: var(--text);
         background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
  input[type=text]:focus { outline: 2px solid var(--accent); }
  button { font: inherit; cursor: pointer; }
  .ask { padding: 12px 20px; border: 0; border-radius: 8px; background: var(--accent);
         color: #fff; font-weight: 600; }
  .ask:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 24px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--card); color: var(--text); font-size: .875rem; }
  .chip:hover { border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 20px; margin-bottom: 16px; }
  .answer { font-size: 1.15rem; font-weight: 600; margin: 0; }
  .error { background: var(--error-soft); border-color: var(--error); color: var(--error); }
  .error p { margin: 0 0 8px; }
  .error ul { margin: 6px 0 0; padding-left: 20px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 0 0 12px; }
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 110px; gap: 10px; align-items: center;
             font-size: .9rem; }
  .bar-track { background: var(--accent-soft); border-radius: 4px; height: 18px; }
  .bar-fill { background: var(--bar); height: 100%; border-radius: 4px; }
  .bar-value { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.num { text-align: right; }
  details summary { cursor: pointer; color: var(--muted); }
  .meta { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin-top: 12px; font-size: .9rem; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; word-break: break-word; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8rem;
         background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; display: inline-block; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem;
           background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .loading { color: var(--muted); }
  @media (max-width: 520px) { .bar-row { grid-template-columns: 80px 1fr 90px; } }
</style>
</head>
<body>
<main>
  <h1>Mini AI Business Intelligence Assistant</h1>
  <p class="sub">Ask a question about the sales data in plain English.</p>

  <form id="ask-form">
    <input type="text" id="question" maxlength="500" autocomplete="off"
           placeholder="e.g. Which product generated the highest revenue?" aria-label="Your question">
    <button class="ask" id="ask-btn" type="submit">Ask</button>
  </form>

  <div class="chips" id="chips"></div>
  <div id="result" aria-live="polite"></div>
</main>

<script>
const EXAMPLES = [
  "What is the total revenue?",
  "Which product generated the highest revenue?",
  "What is the monthly revenue trend?",
  "Which region generated the highest sales?",
  "How did revenue change between February and March?",
];

const form = document.getElementById("ask-form");
const input = document.getElementById("question");
const button = document.getElementById("ask-btn");
const resultBox = document.getElementById("result");

// Build elements with textContent only (never innerHTML) so server text can't inject HTML.
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function fmt(value) {
  if (typeof value === "number") {
    return value.toLocaleString("en-US", { maximumFractionDigits: 2 });
  }
  return value === null || value === undefined ? "" : String(value);
}

function renderError(data) {
  resultBox.replaceChildren();
  const card = el("div", "card error");
  card.appendChild(el("p", "answer", data.message || "Something went wrong."));
  if (Array.isArray(data.supported_examples)) {
    card.appendChild(el("p", null, "Try one of these:"));
    const list = el("ul");
    data.supported_examples.forEach(q => list.appendChild(el("li", null, q)));
    card.appendChild(list);
  }
  resultBox.appendChild(card);
}

function renderBars(rows) {
  const barRows = rows.filter(r => typeof r.revenue === "number" && r.month !== "change");
  if (barRows.length < 2) return null;
  const labelKey = Object.keys(barRows[0])[0];
  const max = Math.max(...barRows.map(r => Math.abs(r.revenue))) || 1;
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Chart"));
  const bars = el("div", "bars");
  barRows.forEach(r => {
    const row = el("div", "bar-row");
    row.appendChild(el("span", null, fmt(r[labelKey])));
    const track = el("div", "bar-track");
    const fill = el("div", "bar-fill");
    fill.style.width = (Math.abs(r.revenue) / max * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "bar-value", fmt(r.revenue)));
    bars.appendChild(row);
  });
  card.appendChild(bars);
  return card;
}

function renderTable(rows) {
  const columns = [];
  rows.forEach(r => Object.keys(r).forEach(k => { if (!columns.includes(k)) columns.push(k); }));
  const card = el("div", "card");
  card.appendChild(el("h2", null, "Supporting data"));
  const wrap = el("div", "table-wrap");
  const table = el("table");
  const headRow = el("tr");
  columns.forEach(c => {
    const numeric = rows.some(r => typeof r[c] === "number");
    headRow.appendChild(el("th", numeric ? "num" : "", c.replace(/_/g, " ")));
  });
  table.appendChild(el("thead")).appendChild(headRow);
  const body = el("tbody");
  rows.forEach(r => {
    const tr = el("tr");
    columns.forEach(c => tr.appendChild(el("td", typeof r[c] === "number" ? "num" : "", fmt(r[c]))));
    body.appendChild(tr);
  });
  table.appendChild(body);
  wrap.appendChild(table);
  card.appendChild(wrap);
  return card;
}

function renderDetails(data) {
  const card = el("div", "card");
  const details = el("details");
  details.appendChild(el("summary", null, "How this answer was produced"));
  const meta = el("dl", "meta");
  const add = (label, node) => { meta.appendChild(el("dt", null, label)); const dd = el("dd"); dd.appendChild(node); meta.appendChild(dd); };
  add("Interpreter", el("span", "badge", data.interpreter === "llm" ? "LLM (Gemini)" : "Rule-based"));
  add("Intent", el("code", null, data.intent));
  if (data.fallback_reason) add("Fallback reason", el("span", null, data.fallback_reason));
  add("Parameters", el("code", null, JSON.stringify(data.params)));
  add("SQL executed", el("code", null, data.sql));
  details.appendChild(meta);
  card.appendChild(details);
  return card;
}

function renderResult(data) {
  resultBox.replaceChildren();
  const answer = el("div", "card");
  answer.appendChild(el("p", "answer", data.answer));
  resultBox.appendChild(answer);
  const rows = Array.isArray(data.data) ? data.data : [];
  if (rows.length) {
    const bars = renderBars(rows);
    if (bars) resultBox.appendChild(bars);
    resultBox.appendChild(renderTable(rows));
  }
  resultBox.appendChild(renderDetails(data));
}

async function ask(question) {
  button.disabled = true;
  resultBox.replaceChildren(el("p", "loading", "Thinking…"));
  try {
    const response = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    let data;
    try { data = await response.json(); }
    catch { data = { message: "The server sent an unreadable response." }; }
    if (response.ok) renderResult(data); else renderError(data);
  } catch (err) {
    renderError({ message: "Could not reach the server. Is it running?" });
  } finally {
    button.disabled = false;
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) { renderError({ message: "Please type a question first.", supported_examples: EXAMPLES }); return; }
  ask(question);
});

EXAMPLES.forEach(q => {
  const chip = el("button", "chip", q);
  chip.type = "button";
  chip.addEventListener("click", () => { input.value = q; ask(q); });
  document.getElementById("chips").appendChild(chip);
});
</script>
</body>
</html>
